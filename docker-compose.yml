version: '3.8'

services:
  app:
    build: .
    ports:
      - "8051:80"
    environment:
      - DATABASE_URL=postgres://lojban:password@db/lojban_lens
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_URL=redis://redis:6379
      # Persist HF ONNX/voice downloads across restarts (not baked into the image).
      - KOKORO_TTS_CACHE_DIR=/var/cache/lensisku/kokoro-martin
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_healthy
    volumes:
      - ./${MAILDIR_PATH}:/usr/src/app/maildir:ro
      - kokoro_tts_cache:/var/cache/lensisku/kokoro-martin
    networks:
      - lojban-network

  redis:
    image: redis:alpine
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 10
    volumes:
      - redis_data:/data
    networks:
      - lojban-network

  db:
    # Postgres 18 images store PGDATA under /var/lib/postgresql/<major>/docker.
    # Mount the volume at /var/lib/postgresql, not /var/lib/postgresql/data.
    image: pgvector/pgvector:pg18-trixie
    command: postgres -c shared_preload_libraries=vector
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - lojban-network

networks:
  lojban-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  kokoro_tts_cache:
