# Cargo configuration
# CXXFLAGS is set here to ensure it's picked up by all cargo commands,
# including 'cargo check'. This is required for dependencies like
# tectonic_xetex_layout which uses ICU headers requiring C++17 features.

[env]
CXXFLAGS = "-std=c++17"

# mold: faster linking than the system linker / lld, no effect on runtime speed.
# Requires the `mold` package (installed in CI and container builders).
[target.'cfg(target_os = "linux")']
rustflags = ["-C", "link-arg=-fuse-ld=mold"]
