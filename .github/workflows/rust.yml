name: Rust

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'frontend/**'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'frontend/**'

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Set C++ standard to C++17 for dependencies that compile C++ code
  # This is required for tectonic_xetex_layout which uses ICU headers
  # that require C++17 features (auto template parameters)
  CXXFLAGS: -std=c++17
  # CI speed: no incremental artifacts, no debuginfo (smaller, faster, better cache).
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  # apt: never wait forever on the dpkg lock (a hung apt step blocked a run for 1.5h).
  APT_OPTS: -o DPkg::Lock::Timeout=120 -o Acquire::Retries=3 --no-install-recommends

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-audit
    - name: Security audit (critical only)
      run: |
        # Check for critical vulnerabilities via JSON output
        if cargo audit --json | jq -e '
          if (.vulnerabilities.found | not) then
            true
          else
            (.vulnerabilities.list | map(select(.advisory.severity == "critical"))) | length == 0
          end
        '; then
          echo "No critical vulnerabilities found."
        else
          echo "Critical vulnerabilities detected! Failing build."
          exit 1
        fi

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    - name: Format
      run: cargo fmt --check

    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: build

    # TeX Live is only needed at runtime for PDF export (xelatex); no test shells out to it.
    - name: Install system dependencies
      timeout-minutes: 8
      run: |
        sudo apt-get $APT_OPTS update
        sudo apt-get $APT_OPTS install -y pkg-config libgraphite2-dev libharfbuzz-dev \
          libfontconfig1-dev libfreetype6-dev mold

    # Clippy --all-targets type-checks everything `cargo check --all-targets` did.
    - name: Clippy
      run: cargo clippy --locked --all-targets -- -D warnings

    - name: Build
      run: cargo build --locked

    - name: Run tests
      run: cargo test --locked

  db-tests:
    # Ignored tests that need real PostgreSQL + Redis. Disposable service containers only.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg18-trixie
        env:
          POSTGRES_PASSWORD: security-test-only
          POSTGRES_DB: security_fixture
        ports: [ "55432:5432" ]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: [ "56379:6379" ]
    env:
      PGPASSWORD: security-test-only
      SECURITY_TEST_DB_PORT: "55432"
      JWT_SECRET: ci-test-only-jwt-secret
      REFRESH_TOKEN_SECRET: ci-test-only-refresh-secret
      SECURITY_TEST_REDIS_URL: redis://127.0.0.1:56379
      RAFSI_TEST_DATABASE_URL: postgres://postgres:security-test-only@127.0.0.1:55432/rafsi_test
      WIKI_TEST_DATABASE_URL: postgres://postgres:security-test-only@127.0.0.1:55432/wiki_test
      LENSISKU_FEED_TEST_DATABASE_URL: postgres://postgres:security-test-only@127.0.0.1:55432/feed_test
      COLLECTIONS_TEST_DATABASE_URL: postgres://postgres:security-test-only@127.0.0.1:55432/lensisku_test
      FLASHCARDS_TEST_DATABASE_URL: postgres://postgres:security-test-only@127.0.0.1:55432/lensisku_test
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: db-tests
    - name: Install system dependencies
      timeout-minutes: 8
      run: |
        sudo apt-get $APT_OPTS update
        sudo apt-get $APT_OPTS install -y pkg-config libgraphite2-dev libharfbuzz-dev \
          libfontconfig1-dev libfreetype6-dev mold postgresql-client
    - name: Create test databases
      run: |
        for db in rafsi_test wiki_test feed_test lensisku_test; do
          psql -h 127.0.0.1 -p 55432 -U postgres -c "CREATE DATABASE $db"
        done
        # Full schema + languages/valsitypes for the collections/flashcards tests.
        # Regenerate from a migrated dev DB: pg_dump -s --no-owner --no-privileges,
        # plus pg_dump -a -t languages -t valsitypes.
        psql -h 127.0.0.1 -p 55432 -U postgres -d lensisku_test -q -v ON_ERROR_STOP=1 \
          -f tests/fixtures/lensisku_schema.sql
    - name: Ignored DB tests
      run: >-
        cargo test --locked --bin lensisku -- --ignored
        security_boundaries rafsi_authority_database wiki_dictionary_namespace_database
        activity_feed_fixtures import_paths_current_behaviour
        merge_anonymous_progress_current_behaviour apply_mix_keeps_owner_progress_active
