name: Rust

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'frontend/**'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'frontend/**'

env:
  CARGO_TERM_COLOR: always
  # Set C++ standard to C++17 for dependencies that compile C++ code
  # This is required for tectonic_xetex_layout which uses ICU headers
  # that require C++17 features (auto template parameters)
  CXXFLAGS: -std=c++17

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt
      # Automatically detects rust-toolchain.toml or rust-toolchain file if present
      # Otherwise uses the latest stable version
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          pkg-config \
          libgraphite2-dev \
          libharfbuzz-dev \
          libfontconfig1-dev \
          libfreetype6-dev \
          mold \
          texlive-xetex \
          texlive-fonts-recommended \
          texlive-fonts-extra \
          texlive-latex-extra \
          texlive-lang-chinese \
          texlive-lang-japanese \
          fonts-noto-cjk \
          fonts-noto-cjk-extra \
          fonts-linuxlibertine \
          jq  # Required for parsing JSON in security audit

    - name: Security audit (critical only)
      run: |
        cargo install --locked cargo-audit
        # Check for critical vulnerabilities via JSON output
        if cargo audit --json | jq -e '
          if (.vulnerabilities.found | not) then
            true
          else
            (.vulnerabilities.list | map(select(.advisory.severity == "critical"))) | length == 0
          end
        '; then
          echo "No critical vulnerabilities found."
        else
          echo "Critical vulnerabilities detected! Failing build."
          exit 1
        fi

    # - name: Dependency checks
    #   run: |
    #     cargo install cargo-deny
    #     cargo deny check

    - name: Format
      run: cargo fmt --check

    - name: Check all Rust targets
      run: cargo check --all-targets

    - name: Clippy
      run: cargo clippy --all-targets -- -D warnings

    - name: Build
      run: cargo build --verbose

    - name: Run tests
      run: cargo test --verbose

  db-tests:
    # Ignored tests that need real PostgreSQL + Redis. Disposable service containers only.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18-trixie
        env:
          POSTGRES_PASSWORD: security-test-only
          POSTGRES_DB: security_fixture
        ports: [ "55432:5432" ]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: [ "56379:6379" ]
    env:
      PGPASSWORD: security-test-only
      SECURITY_TEST_DB_PORT: "55432"
      SECURITY_TEST_REDIS_URL: redis://127.0.0.1:56379
      RAFSI_TEST_DATABASE_URL: postgres://postgres:security-test-only@127.0.0.1:55432/rafsi_test
      WIKI_TEST_DATABASE_URL: postgres://postgres:security-test-only@127.0.0.1:55432/wiki_test
      LENSISKU_FEED_TEST_DATABASE_URL: postgres://postgres:security-test-only@127.0.0.1:55432/feed_test
      COLLECTIONS_TEST_DATABASE_URL: postgres://postgres:security-test-only@127.0.0.1:55432/lensisku_test
      FLASHCARDS_TEST_DATABASE_URL: postgres://postgres:security-test-only@127.0.0.1:55432/lensisku_test
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libgraphite2-dev libharfbuzz-dev \
          libfontconfig1-dev libfreetype6-dev mold postgresql-client
    - name: Create test databases
      run: |
        for db in rafsi_test wiki_test feed_test lensisku_test; do
          psql -h 127.0.0.1 -p 55432 -U postgres -c "CREATE DATABASE $db"
        done
        # Full schema + languages/valsitypes for the collections/flashcards tests.
        # Regenerate from a migrated dev DB: pg_dump -s --no-owner --no-privileges,
        # plus pg_dump -a -t languages -t valsitypes.
        psql -h 127.0.0.1 -p 55432 -U postgres -d lensisku_test -q -v ON_ERROR_STOP=1 \
          -f tests/fixtures/lensisku_schema.sql
    - name: Ignored DB tests
      run: >-
        cargo test --bin lensisku -- --ignored
        security_boundaries rafsi_authority_database wiki_dictionary_namespace_database
        activity_feed_fixtures import_paths_current_behaviour
        merge_anonymous_progress_current_behaviour apply_mix_keeps_owner_progress_active
